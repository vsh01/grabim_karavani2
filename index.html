<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Грабим Корованы 2</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🌲</text></svg>" />
    <style>
      :root {
        --ink: #e8e2d0;
        --gold: #d9b45a;
        --blood: #8d2323;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #0a0d0b;
        color: var(--ink);
        font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }

      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(ellipse at 50% 40%, #1b2a1c 0%, #080b09 70%);
        z-index: 50;
        transition: opacity 0.6s ease;
      }
      #boot.hidden { opacity: 0; pointer-events: none; }
      #boot h1 {
        margin: 0;
        font-size: clamp(28px, 6vw, 58px);
        letter-spacing: 0.06em;
        color: var(--gold);
        text-shadow: 0 4px 24px rgba(0, 0, 0, 0.8);
      }
      #boot .sub { opacity: 0.65; font-size: 15px; letter-spacing: 0.16em; text-transform: uppercase; }
      #boot .bar { width: min(420px, 70vw); height: 4px; background: rgba(255,255,255,0.12); border-radius: 2px; overflow: hidden; }
      #boot .bar > i { display: block; height: 100%; width: 0%; background: var(--gold); transition: width 0.25s ease; }
      #boot .status { font-size: 13px; opacity: 0.5; min-height: 1.2em; }
      #boot .err { color: #ff8a8a; max-width: 70vw; text-align: center; font-size: 13px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot">
      <h1>Грабим Корованы 2</h1>
      <div class="sub">Джва года ожидания</div>
      <div class="bar"><i id="boot-bar"></i></div>
      <div class="status" id="boot-status">Пробуждение мира…</div>
      <div class="err" id="boot-err"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
